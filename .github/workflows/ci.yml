name: CI

on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  # РџРµСЂРµРІС–СЂРєР° СЃС‚РёР»СЋ РєРѕРґСѓ С‚Р° С„СѓРЅРєС†С–Р№ РІР°СЂС–Р°РЅС‚Р° 5.
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: РћС‚СЂРёРјР°С‚Рё РєРѕРґ СЂРµРїРѕР·РёС‚РѕСЂС–СЋ
        uses: actions/checkout@v6

      - name: РќР°Р»Р°С€С‚СѓРІР°С‚Рё Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Р’СЃС‚Р°РЅРѕРІРёС‚Рё Р·Р°Р»РµР¶РЅРѕСЃС‚С–
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8

      - name: РџРµСЂРµРІС–СЂРёС‚Рё СЃС‚РёР»СЊ РєРѕРґСѓ
        run: flake8 .

      - name: РџРµСЂРµРІС–СЂРёС‚Рё С„СѓРЅРєС†С–С— РІР°СЂС–Р°РЅС‚Р° 5
        run: python -m pytest test_number_theory.py -v

  # Р—Р±С–СЂРєР° С‚Р° РїСѓР±Р»С–РєР°С†С–СЏ Docker-РѕР±СЂР°Р·Сѓ РїС–СЃР»СЏ СѓСЃРїС–С€РЅРёС… РїРµСЂРµРІС–СЂРѕРє.
  build-and-push-image:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: РћС‚СЂРёРјР°С‚Рё РєРѕРґ СЂРµРїРѕР·РёС‚РѕСЂС–СЋ
        uses: actions/checkout@v6

      - name: РЈРІС–Р№С‚Рё РІ GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

      - name: Р’РёР·РЅР°С‡РёС‚Рё С‚РµРіРё Docker-РѕР±СЂР°Р·Сѓ
        id: docker-tags
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ci-lab-app"

          TAGS="$IMAGE:$GITHUB_SHA"

          # Р”Р»СЏ Р·РІРёС‡Р°Р№РЅРѕРіРѕ push Сѓ main РґРѕРґР°С”РјРѕ latest.
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAGS="$TAGS $IMAGE:latest"
          fi

          # Р”Р»СЏ Git-С‚РµРіР° v1.2.3 РґРѕРґР°С”РјРѕ СЃРµРјР°РЅС‚РёС‡РЅС– С‚РµРіРё.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"

            if [[ "$VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"

              TAGS="$TAGS $IMAGE:$VERSION"
              TAGS="$TAGS $IMAGE:v$MAJOR.$MINOR"
              TAGS="$TAGS $IMAGE:v$MAJOR"
              TAGS="$TAGS $IMAGE:latest"
            else
              echo "РќРµРєРѕСЂРµРєС‚РЅРёР№ SemVer-С‚РµРі: $VERSION"
              exit 1
            fi
          fi

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Р—С–Р±СЂР°С‚Рё Docker-РѕР±СЂР°Р·
        shell: bash
        run: |
          BUILD_TAGS=""

          for TAG in ${{ steps.docker-tags.outputs.tags }}; do
            BUILD_TAGS="$BUILD_TAGS -t $TAG"
          done

          docker build $BUILD_TAGS .

      - name: Р—Р°РІР°РЅС‚Р°Р¶РёС‚Рё РѕР±СЂР°Р· Сѓ СЂРµС”СЃС‚СЂ
        shell: bash
        run: |
          for TAG in ${{ steps.docker-tags.outputs.tags }}; do
            docker push "$TAG"
          done

  # Р РѕР·РіРѕСЂС‚Р°РЅРЅСЏ РєРѕРЅС‚РµР№РЅРµСЂР° Р·Р° РґРѕРїРѕРјРѕРіРѕСЋ Terraform.
  deploy:
    needs: build-and-push-image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: РћС‚СЂРёРјР°С‚Рё РєРѕРґ СЂРµРїРѕР·РёС‚РѕСЂС–СЋ
        uses: actions/checkout@v6

      - name: Р’СЃС‚Р°РЅРѕРІРёС‚Рё Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"

      - name: РЈРІС–Р№С‚Рё РІ GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: terraform init
        working-directory: infra
        run: terraform init

      - name: terraform apply
        working-directory: infra
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ci-lab-app:${GITHUB_SHA}"
          terraform apply -auto-approve -var="image_name=$IMAGE"

      - name: РџРµСЂРµРІС–СЂРёС‚Рё СЂРµР·СѓР»СЊС‚Р°С‚ СЂРѕР·РіРѕСЂС‚Р°РЅРЅСЏ (smoke-test)
        shell: bash
        run: |
          docker logs ci-lab-deploy
          EXIT_CODE=$(docker inspect ci-lab-deploy --format='{{.State.ExitCode}}')
          echo "РљРѕРґ Р·Р°РІРµСЂС€РµРЅРЅСЏ РєРѕРЅС‚РµР№РЅРµСЂР°: $EXIT_CODE"
          test "$EXIT_CODE" -eq 0

      - name: terraform destroy
        if: always()
        working-directory: infra
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ci-lab-app:${GITHUB_SHA}"
          terraform destroy -auto-approve -var="image_name=$IMAGE"

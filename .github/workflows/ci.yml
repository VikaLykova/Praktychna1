name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v6

      - name: Налаштувати Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Встановити залежності
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Перевірити функції варіанта 5
        run: python -m pytest test_number_theory.py -v
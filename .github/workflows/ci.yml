name: CI

on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  # Перевірка стилю коду та функцій варіанта 5.
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v6

      - name: Налаштувати Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Встановити залежності
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8

      - name: Перевірити стиль коду
        run: flake8 .

      - name: Перевірити функції варіанта 5
        run: python -m pytest test_number_theory.py -v

  # Збірка та публікація Docker-образу після успішних перевірок.
  build-and-push-image:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v6

      - name: Увійти в GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

      - name: Визначити теги Docker-образу
        id: docker-tags
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ci-lab-app"

          TAGS="$IMAGE:$GITHUB_SHA"

          # Для звичайного push у main додаємо latest.
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAGS="$TAGS $IMAGE:latest"
          fi

          # Для Git-тега v1.2.3 додаємо семантичні теги.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"

            if [[ "$VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"

              TAGS="$TAGS $IMAGE:$VERSION"
              TAGS="$TAGS $IMAGE:v$MAJOR.$MINOR"
              TAGS="$TAGS $IMAGE:v$MAJOR"
              TAGS="$TAGS $IMAGE:latest"
            else
              echo "Некоректний SemVer-тег: $VERSION"
              exit 1
            fi
          fi

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Зібрати Docker-образ
        shell: bash
        run: |
          BUILD_TAGS=""

          for TAG in ${{ steps.docker-tags.outputs.tags }}; do
            BUILD_TAGS="$BUILD_TAGS -t $TAG"
          done

          docker build $BUILD_TAGS .

      - name: Завантажити образ у реєстр
        shell: bash
        run: |
          for TAG in ${{ steps.docker-tags.outputs.tags }}; do
            docker push "$TAG"
          done

  # Розгортання контейнера за допомогою Terraform.
  deploy:
    needs: build-and-push-image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v6

      - name: Встановити Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"

      - name: Увійти в GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: terraform init
        working-directory: infra
        run: terraform init

      - name: terraform apply
        working-directory: infra
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ci-lab-app:${GITHUB_SHA}"
          terraform apply -auto-approve -var="image_name=$IMAGE"

      - name: Перевірити результат розгортання (smoke-test)
        shell: bash
        run: |
          docker logs ci-lab-deploy
          EXIT_CODE=$(docker inspect ci-lab-deploy --format='{{.State.ExitCode}}')
          echo "Код завершення контейнера: $EXIT_CODE"
          test "$EXIT_CODE" -eq 0

      - name: terraform destroy
        if: always()
        working-directory: infra
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ci-lab-app:${GITHUB_SHA}"
          terraform destroy -auto-approve -var="image_name=$IMAGE"
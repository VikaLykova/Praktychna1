name: CI

on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  # Перевірка стилю коду та функцій варіанта 5.
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v6

      - name: Налаштувати Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Встановити залежності
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8

      - name: Перевірити стиль коду
        run: flake8 .

      - name: Перевірити функції варіанта 5
        run: python -m pytest test_number_theory.py -v

  # Збірка та публікація Docker-образу після успішних перевірок.
  build-and-push-image:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v6

      - name: Увійти в GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

      - name: Визначити теги Docker-образу
        id: docker-tags
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ci-lab-app"

          TAGS="$IMAGE:$GITHUB_SHA"

          # Для звичайного push у main додаємо latest.
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAGS="$TAGS $IMAGE:latest"
          fi

          # Якщо workflow запущено Git-тегом v1.2.3,
          # додаємо семантичні теги v1.2.3, v1.2 та v1.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"

            if [[ "$VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"

              TAGS="$TAGS"
              TAGS="$TAGS $IMAGE:$VERSION"
              TAGS="$TAGS $IMAGE:v$MAJOR.$MINOR"
              TAGS="$TAGS $IMAGE:v$MAJOR"
              TAGS="$TAGS $IMAGE:latest"
            else
              echo "Некоректний SemVer-тег: $VERSION"
              exit 1
            fi
          fi

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Зібрати Docker-образ
        shell: bash
        run: |
          BUILD_TAGS=""

          for TAG in ${{ steps.docker-tags.outputs.tags }}; do
            BUILD_TAGS="$BUILD_TAGS -t $TAG"
          done

          docker build $BUILD_TAGS .

      - name: Завантажити образ у реєстр
        shell: bash
        run: |
          for TAG in ${{ steps.docker-tags.outputs.tags }}; do
            docker push "$TAG"
          done
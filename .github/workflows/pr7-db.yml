# ПР7: перевірка бази в CI. На кожен push із змінами в pr7/ конвеєр створює
# порожній PostgreSQL 16, застосовує всі міграції двічі (друга спроба має нічого
# не змінити), завантажує дані й виконує всі SQL-запити. Будь-яка помилка SQL
# зупиняє конвеєр (ON_ERROR_STOP), тож «червоний» запуск = схема або запит зламані.
name: pr7-db

on:
  push:
    paths: ['pr7/**', '.github/workflows/pr7-db.yml']
  workflow_dispatch:

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cityair
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: cityair
    defaults:
      run:
        working-directory: pr7
    steps:
      - uses: actions/checkout@v4

      - name: Міграції з порожньої бази
        run: psql -v ON_ERROR_STOP=1 -f db/migrate.sql

      - name: Повторний запуск міграцій (нічого не має змінитися)
        run: psql -v ON_ERROR_STOP=1 -f db/migrate.sql

      - name: Дані (усі файли db/seed за абеткою)
        run: for f in db/seed/*.sql; do echo "== $f"; psql -v ON_ERROR_STOP=1 -q -f "$f"; done

      - name: Запити (усі файли sql за абеткою)
        run: |
          set -euo pipefail
          mkdir -p results
          for f in sql/*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -f "$f" | tee "results/$(basename "$f" .sql).txt"
          done

      - name: Результати запитів
        uses: actions/upload-artifact@v4
        with:
          name: pr7-query-results
          path: pr7/results/
